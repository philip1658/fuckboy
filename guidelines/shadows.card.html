<!-- @dsCard group="Surfaces" viewport="700x180" name="Shadows & glows" subtitle="Hard 1px seat plus a deep soft drop. Glow replaces shadow for accents." -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 20px;background:var(--bg-page)}.row{display:flex;gap:10px}.lbl{font:var(--type-stamp);letter-spacing:var(--text-nano-ls);text-transform:uppercase;color:var(--text-faint)}.s{flex:1;height:82px;background:var(--bg-surface-raised);border:var(--border-subtle);display:flex;align-items:flex-end;padding:9px}.s span{font:var(--type-stamp);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row" style="padding:6px 4px 22px"><div class="s" style="box-shadow:var(--shadow-card)"><span>card</span></div><div class="s" style="box-shadow:var(--shadow-lift)"><span>lift</span></div><div class="s" style="box-shadow:var(--shadow-modal)"><span>modal</span></div><div class="s" style="box-shadow:var(--glow-volt)"><span>glow volt</span></div><div class="s" style="box-shadow:var(--glow-wire)"><span>glow wire</span></div></div><div style="font:var(--type-caption);color:var(--text-muted);border-top:var(--border-subtle);padding-top:9px">No shadow on paper inserts except --shadow-paper. Never a coloured drop shadow other than the two glows.</div></body></html>
