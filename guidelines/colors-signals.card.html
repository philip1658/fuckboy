<!-- @dsCard group="Colors" viewport="700x160" name="Learning signals" subtitle="Score, consent, red flag, locked — each owns exactly one hue." -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 20px;background:var(--bg-page)}.row{display:flex;gap:10px}.lbl{font:var(--type-stamp);letter-spacing:var(--text-nano-ls);text-transform:uppercase;color:var(--text-faint)}.s{flex:1;padding:12px;border:var(--border-subtle);background:var(--bg-surface)}.s i{display:block;height:3px;margin-bottom:10px}.s span{font:var(--type-stamp);letter-spacing:.16em;text-transform:uppercase;color:var(--text-secondary);display:block}.s em{font:var(--type-caption);font-style:normal;color:var(--text-faint);display:block;margin-top:4px}</style></head><body><div class="row"><div class="s"><i style="background:var(--score-gain)"></i><span>Score +</span><em>Charme, Authentizität</em></div><div class="s"><i style="background:var(--score-loss)"></i><span>Score −</span><em>Kollateralschaden</em></div><div class="s"><i style="background:var(--signal-consent)"></i><span>Consent</span><em>Nicht verhandelbar</em></div><div class="s"><i style="background:var(--signal-caution)"></i><span>Caution</span><em>Unklares Signal</em></div><div class="s"><i style="background:var(--signal-locked)"></i><span>Locked</span><em>Noch gesperrt</em></div></div></body></html>
