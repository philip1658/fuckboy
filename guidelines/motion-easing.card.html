<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 20px;background:var(--bg-page)}.row{display:flex;gap:10px}.lbl{font:var(--type-stamp);letter-spacing:var(--text-nano-ls);text-transform:uppercase;color:var(--text-faint)}.r{display:flex;align-items:center;gap:14px;padding:6px 0;border-bottom:var(--border-subtle)}.r b{font:var(--type-stamp);letter-spacing:.16em;text-transform:uppercase;color:var(--text-secondary);width:120px;flex:none}.r em{font:var(--type-caption);font-family:var(--font-mono);font-style:normal;color:var(--text-faint)}.r span{font:var(--type-caption);color:var(--text-muted)}</style></head><body><div><div class="r"><b>ease-out</b><em>cubic-bezier(.2,.8,.24,1)</em><span>Enter, hover</span></div><div class="r"><b>ease-in-out</b><em>cubic-bezier(.6,0,.28,1)</em><span>Screen change</span></div><div class="r"><b>ease-snap</b><em>cubic-bezier(.16,1,.3,1)</em><span>Card swipe, unlock</span></div><div class="r"><b>dur-fast 140ms</b><em></em><span>Hover, press</span></div><div class="r"><b>dur-base 220ms</b><em></em><span>Panels, chips</span></div><div class="r"><b>dur-redact 900ms</b><em></em><span>Redaction wipe</span></div></div></body></html>
