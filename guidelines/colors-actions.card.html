<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 20px;background:var(--bg-page)}.row{display:flex;gap:10px}.lbl{font:var(--type-stamp);letter-spacing:var(--text-nano-ls);text-transform:uppercase;color:var(--text-faint)}.b{padding:11px 20px;font:var(--type-label);letter-spacing:.1em;text-transform:uppercase;border:0;border-radius:var(--radius-xs)}</style></head><body><div class="row" style="align-items:center;flex-wrap:wrap"><button class="b" style="background:var(--action-primary-bg);color:var(--action-primary-fg)">Weiter</button><button class="b" style="background:transparent;color:var(--action-secondary-fg);box-shadow:inset 0 0 0 1px var(--rule-default)">Zurück</button><button class="b" style="background:transparent;color:var(--action-ghost-fg)">Überspringen</button><button class="b" style="background:var(--action-danger-bg);color:var(--paper-100)">Abbrechen</button><button class="b" style="background:var(--action-accent-bg);color:var(--action-accent-fg)">Freischalten</button><button class="b" style="background:var(--action-disabled-bg);color:var(--action-disabled-fg)">Gesperrt</button></div></body></html>
