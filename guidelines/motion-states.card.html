<!-- @dsCard group="Motion" viewport="700x200" name="Hover & press" subtitle="Hover lifts 2px and brightens the rule. Press scales to 0.985 — no colour flash." -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 20px;background:var(--bg-page)}.row{display:flex;gap:10px}.lbl{font:var(--type-stamp);letter-spacing:var(--text-nano-ls);text-transform:uppercase;color:var(--text-faint)}.c{flex:1;background:var(--bg-surface);border:var(--border-subtle);padding:14px;transition:var(--transition-surface),border-color var(--dur-fast) var(--ease-out)}.c b{display:block;font:var(--type-stamp);letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);margin-bottom:9px}.c span{font:var(--type-body-sm);color:var(--text-secondary)}</style></head><body><div class="row" style="align-items:stretch"><div class="c"><b>Rest</b><span>Ich sag ihr, was ich will.</span></div><div class="c" style="transform:translateY(-2px);border-color:var(--rule-default);box-shadow:var(--shadow-lift)"><b style="color:var(--volt-500)">Hover</b><span style="color:var(--text-primary)">Ich sag ihr, was ich will.</span></div><div class="c" style="transform:scale(.985);background:var(--ink-600)"><b>Press</b><span>Ich sag ihr, was ich will.</span></div><div class="c" style="opacity:var(--opacity-disabled)"><b>Disabled</b><span>Ich sag ihr, was ich will.</span></div></div><div style="font:var(--type-caption);color:var(--text-muted);margin-top:12px;border-top:var(--border-subtle);padding-top:9px">Selected state = 1px volt border + volt kicker. Never a filled accent background on a choice card.</div></body></html>
