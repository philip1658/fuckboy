<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 20px;background:var(--bg-page)}.row{display:flex;gap:10px}.lbl{font:var(--type-stamp);letter-spacing:var(--text-nano-ls);text-transform:uppercase;color:var(--text-faint)}.t{display:flex;align-items:baseline;gap:14px;padding:7px 0;border-bottom:var(--border-subtle)}.t b{font:var(--type-stamp);letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);width:150px;flex:none}</style></head><body><div><div class="t"><b>--text-primary</b><span style="color:var(--text-primary);font:var(--type-body-sm)">Klare Kommunikation schlägt versteckte Erwartung.</span></div><div class="t"><b>--text-secondary</b><span style="color:var(--text-secondary);font:var(--type-body-sm)">Sekundäre Erklärung, Deck-Text, Bildlegende.</span></div><div class="t"><b>--text-muted</b><span style="color:var(--text-muted);font:var(--type-body-sm)">Metadaten, Zeitstempel, Kapitelnummer.</span></div><div class="t"><b>--text-faint</b><span style="color:var(--text-faint);font:var(--type-body-sm)">Stempel, Aktenzeichen, Disclaimer.</span></div></div></body></html>
