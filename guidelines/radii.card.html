<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 20px;background:var(--bg-page)}.row{display:flex;gap:10px}.lbl{font:var(--type-stamp);letter-spacing:var(--text-nano-ls);text-transform:uppercase;color:var(--text-faint)}.r{flex:1}.r i{display:block;height:60px;background:var(--bg-surface-raised);border:var(--border-default)}.r span{display:block;font:var(--type-stamp);letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary);margin-top:8px}.r em{font:var(--type-caption);font-family:var(--font-mono);font-style:normal;color:var(--text-faint)}</style></head><body><div class="row"><div class="r"><i style="border-radius:0px"></i><span>none</span><em>0px</em></div><div class="r"><i style="border-radius:2px"></i><span>xs</span><em>2px</em></div><div class="r"><i style="border-radius:4px"></i><span>md</span><em>4px</em></div><div class="r"><i style="border-radius:6px"></i><span>lg</span><em>6px</em></div><div class="r"><i style="border-radius:999px"></i><span>pill</span><em>999px</em></div></div></body></html>
