<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 20px;background:var(--bg-page)}.row{display:flex;gap:10px}.lbl{font:var(--type-stamp);letter-spacing:var(--text-nano-ls);text-transform:uppercase;color:var(--text-faint)}.p{flex:1;padding:16px;border:var(--border-subtle);background:var(--bg-surface);text-align:center}.p i{display:block;width:34px;height:34px;border-radius:var(--radius-pill);margin:0 auto 12px}.p b{display:block;font:var(--type-kicker);font-weight:600;letter-spacing:.14em;text-transform:uppercase}.p span{display:block;font:var(--type-caption);color:var(--text-muted);margin-top:6px}</style></head><body><div class="row"><div class="p" style="box-shadow:var(--glow-bordeaux)"><i style="background:var(--pill-red)"></i><b style="color:var(--bordeaux-400)">Rote Pille</b><span>Nimm das Werkzeug. Trag die Kosten.</span></div><div class="p"><i style="background:var(--pill-blue)"></i><b style="color:var(--wire-500)">Blaue Pille</b><span>Sag die Wahrheit. Verkleinere den Pool.</span></div></div></body></html>
