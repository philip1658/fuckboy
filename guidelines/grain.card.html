<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 20px;background:var(--bg-page)}.row{display:flex;gap:10px}.lbl{font:var(--type-stamp);letter-spacing:var(--text-nano-ls);text-transform:uppercase;color:var(--text-faint)}.t{flex:1;height:96px;border:var(--border-subtle);position:relative;background:var(--ink-700);display:flex;align-items:flex-end;padding:9px}.t span{font:var(--type-stamp);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);position:relative;z-index:1}</style></head><body><div class="row"><div class="t" data-grain><span>--texture-grain</span></div><div class="t" style="background-image:var(--scanline)"><span>--scanline</span></div><div class="t" style="filter:var(--blur-locked)"><span>--blur-locked</span></div></div></body></html>
