<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 20px;background:var(--bg-page)}.row{display:flex;gap:10px}.lbl{font:var(--type-stamp);letter-spacing:var(--text-nano-ls);text-transform:uppercase;color:var(--text-faint)}.s{flex:1;height:96px;display:flex;align-items:flex-end;padding:10px;border:var(--border-subtle)}.s span{font:var(--type-stamp);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="s" style="background:var(--bg-void)"><span>void</span></div><div class="s" style="background:var(--bg-page)"><span>page</span></div><div class="s" style="background:var(--bg-surface)"><span>surface</span></div><div class="s" style="background:var(--bg-surface-raised)"><span>raised</span></div><div class="s" style="background:var(--bg-paper)"><span style="color:var(--ink-500)">paper</span></div></div></body></html>
